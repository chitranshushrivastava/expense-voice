<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <meta name="theme-color" content="#0a0b0d">
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><rect width='180' height='180' rx='40' fill='%23000000'/><text x='90' y='128' font-size='105' font-family='Arial, sans-serif' fill='white' text-anchor='middle'>₹</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0b0d;
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Ambient animated background glow */
    #bg-glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    #bg-glow::before, #bg-glow::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.15;
      animation: float 12s ease-in-out infinite;
    }
    #bg-glow::before {
      background: #10b981;
      top: -80px;
      left: -60px;
    }
    #bg-glow::after {
      background: #059669;
      bottom: -100px;
      right: -60px;
      animation-delay: 4s;
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, 40px) scale(1.15); }
    }

    /* Header */
    #header {
      position: relative;
      z-index: 2;
      background: rgba(20, 22, 26, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 18px 18px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    #header h1 {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.2px;
    }
    #pulseDot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 0 0 rgba(52,211,153,0.6);
      animation: dotPulse 2s infinite;
    }
    @keyframes dotPulse {
      0% { box-shadow: 0 0 0 0 rgba(52,211,153,0.5); }
      70% { box-shadow: 0 0 0 6px rgba(52,211,153,0); }
      100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
    }
    #statsRow {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .statCard {
      flex: 1;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 10px 12px;
    }
    .statCard .label {
      font-size: 11px;
      color: #8b8f98;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .statCard .value {
      font-size: 19px;
      font-weight: 700;
      color: #34d399;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    /* Chat area */
    #chat {
      position: relative;
      z-index: 1;
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .row { display: flex; gap: 8px; align-items: flex-end; max-width: 92%; }
    .row.user { align-self: flex-end; flex-direction: row-reverse; }
    .avatar {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; flex-shrink: 0;
      background: #1a1d23; border: 1px solid rgba(255,255,255,0.08);
    }
    .row.user .avatar { background: linear-gradient(135deg, #10b981, #059669); }

    .bubble {
      padding: 11px 15px;
      border-radius: 16px;
      font-size: 14.5px;
      line-height: 1.5;
      animation: pop 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(8px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .row.user .bubble {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 14px rgba(16,185,129,0.25);
    }
    .row.bot .bubble {
      background: #16181d;
      border: 1px solid rgba(255,255,255,0.07);
      border-bottom-left-radius: 4px;
    }
    .row.bot .bubble.success { border-color: rgba(52,211,153,0.4); box-shadow: 0 0 0 1px rgba(52,211,153,0.1) inset; }
    .row.bot .bubble.error { border-color: rgba(248,113,113,0.4); }

    .chipGrid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .chip {
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.03);
      color: #e5e7eb;
      padding: 9px 15px;
      border-radius: 20px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
      display: flex; align-items: center; gap: 6px;
    }
    .chip:active { transform: scale(0.93); }
    .chip:not(:disabled):hover { border-color: #34d399; background: rgba(52,211,153,0.08); }
    .chip:disabled { opacity: 0.35; }
    .chip.picked { border-color: #34d399; background: rgba(52,211,153,0.15); color: #34d399; }

    .typing { display: flex; gap: 4px; padding: 4px 2px; }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%;
      background: #6b7280;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    /* Input area */
    #inputArea {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      padding: 10px 10px 14px;
      background: rgba(20, 22, 26, 0.9);
      backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255,255,255,0.06);
      gap: 8px;
    }
    #msgInput {
      flex: 1;
      padding: 12px 16px;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 15px;
      background: rgba(255,255,255,0.04);
      color: #e5e7eb;
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    #msgInput::placeholder { color: #6b7280; }
    #msgInput:focus { border-color: #34d399; background: rgba(52,211,153,0.05); }

    #micBtn, #sendBtn {
      position: relative;
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease;
      flex-shrink: 0;
      overflow: hidden;
    }
    #sendBtn {
      background: linear-gradient(135deg, #34d399, #10b981);
      color: #06120c;
      box-shadow: 0 4px 14px rgba(16,185,129,0.3);
    }
    #micBtn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #e5e7eb;
    }
    #micBtn.listening {
      background: rgba(248,113,113,0.15);
      border-color: #f87171;
      color: #fca5a5;
    }
    #micBtn.listening::before, #micBtn.listening::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid #f87171;
      animation: ripple 1.4s ease-out infinite;
    }
    #micBtn.listening::after { animation-delay: 0.5s; }
    @keyframes ripple {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(2.1); opacity: 0; }
    }
    #micBtn:active, #sendBtn:active { transform: scale(0.9); }

    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

    #chatToggleBtn {
      position: absolute;
      top: 18px;
      right: 18px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #e5e7eb;
      width: 38px; height: 38px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.12s ease, border-color 0.15s ease;
    }
    #chatToggleBtn:active { transform: scale(0.92); }
    #chatToggleBtn:hover { border-color: #34d399; }

    #chartView {
      position: relative;
      z-index: 1;
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 16px;
    }
    #chartView.visible { display: flex; }
    #chat.hidden { display: none; }

    .dashHeader {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .statGrid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .statBox {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 14px;
    }
    .statBox .label {
      font-size: 11px;
      color: #8b8f98;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .statBox .value {
      font-size: 20px;
      font-weight: 700;
      color: #34d399;
      margin-top: 4px;
    }
    .statBox.wide { grid-column: span 2; }

    .chartCard {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px;
      padding: 16px;
    }
    .chartCard h3 {
      font-size: 13px;
      color: #9ca3af;
      font-weight: 600;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .canvasWrap {
      position: relative;
      width: 100%;
      height: 220px;
    }
    .emptyState {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      padding: 30px 10px;
    }

    .recentList { display: flex; flex-direction: column; gap: 10px; }
    .recentItem {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .recentItem:last-child { border-bottom: none; padding-bottom: 0; }
    .recentItem .left { display: flex; flex-direction: column; }
    .recentItem .cat { font-size: 14px; font-weight: 600; }
    .recentItem .meta { font-size: 12px; color: #6b7280; margin-top: 2px; }
    .recentItem .amt { font-size: 15px; font-weight: 700; color: #34d399; }

    #enableSummaryBtn {
      width: 100%;
      padding: 13px;
      border-radius: 14px;
      border: 1px solid rgba(52,211,153,0.3);
      background: rgba(52,211,153,0.08);
      color: #34d399;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    #enableSummaryBtn:active { transform: scale(0.98); }
    #enableSummaryBtn:disabled { opacity: 0.6; }

    #inputArea.hidden { display: none; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>

  <div id="bg-glow"></div>

  <div id="header">
    <button id="chatToggleBtn" onclick="toggleChartView()">📊</button>
    <h1><span id="pulseDot"></span>Expense Tracker</h1>
    <div id="statsRow">
      <div class="statCard">
        <div class="label">Today</div>
        <div class="value" id="todayTotal">₹0</div>
      </div>
      <div class="statCard">
        <div class="label">This month</div>
        <div class="value" id="monthTotal">₹0</div>
      </div>
    </div>
  </div>

  <div id="chat"></div>

  <div id="chartView">
    <div class="dashHeader">📊 Dashboard</div>

    <div class="statGrid">
      <div class="statBox">
        <div class="label">Today</div>
        <div class="value" id="dashToday">₹0</div>
      </div>
      <div class="statBox">
        <div class="label">This Month</div>
        <div class="value" id="dashMonth">₹0</div>
      </div>
      <div class="statBox">
        <div class="label">Top Category</div>
        <div class="value" id="dashTopCat" style="font-size:16px;">—</div>
      </div>
      <div class="statBox">
        <div class="label">Transactions</div>
        <div class="value" id="dashCount">0</div>
      </div>
    </div>

    <div class="chartCard">
      <h3>Category-wise Spend</h3>
      <div class="canvasWrap"><canvas id="pieCanvas"></canvas></div>
    </div>

    <div class="chartCard">
      <h3>Monthly Trend</h3>
      <div class="canvasWrap"><canvas id="trendCanvas"></canvas></div>
    </div>

    <div class="chartCard">
      <h3>Recent Transactions</h3>
      <div class="recentList" id="recentList"></div>
    </div>

    <button id="enableSummaryBtn" onclick="enableMonthlySummary()">🔔 Enable Monthly Email Summary</button>
  </div>

  <div id="inputArea">
    <button id="micBtn" onclick="toggleVoice()">🎤</button>
    <input type="text" id="msgInput" placeholder="Type, or tap the mic to speak" inputmode="text" />
    <button id="sendBtn" onclick="handleTextSend()">➤</button>
  </div>

<script>
  // ⚠️ IMPORTANT: Apna Apps Script deployment URL yahan paste karo
  const SCRIPT_URL = https://script.google.com/macros/s/AKfycbwxRoLvYgLJRWhJT3o6ILqPb-Mf-VG7YE8FyoCx9p4fsVrp6zr07zfpUdW_so2ycYq7/exec ;

  // Reusable helper — replaces google.script.run, works from any domain
  function callApi(action, params, onSuccess, onError) {
    fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: action }, params || {}))
    })
      .then(res => res.json())
      .then(res => {
        if (res.ok) onSuccess(res.data);
        else onError(new Error(res.message || 'Unknown error'));
      })
      .catch(err => onError(err));
  }

  const chat = document.getElementById('chat');
  const CATEGORIES = [
    ["Food","🍔"], ["Travel","🚗"], ["Bills","🧾"],
    ["Shopping","🛍️"], ["Home","🏠"], ["Personal","🧴"], ["Other","📦"]
  ];
  const METHODS = [["UPI","📲"], ["Cash","💵"], ["Card","💳"]];
  const UPI_APPS = [["GPay","🟢"], ["PhonePe","🟣"], ["Paytm","🔵"]];
  const ACCOUNTS = [["SBI","🏦"], ["IOB","🏦"], ["Union Bank","🏦"]];

  let draft = {};
  let mode = 'ai';

  showModePicker();
  refreshStats();

  function showModePicker() {
    addBotMessage("Kaise expense add karna chahoge?");
    addBotChips("", [["✨ AI Quick Add",""], ["🔍 Ask a Question",""], ["🔘 Step-by-step",""]], (val) => {
      if (val === "✨ AI Quick Add") {
        mode = 'ai';
        addBotMessage("Ek line me poora likho ya bolo, jaise:<br><i>\"petrol 500 UPI GPay SBI\"</i>");
      } else if (val === "🔍 Ask a Question") {
        mode = 'ask';
        addBotMessage("Kya jaanna chahte ho? Jaise:<br><i>\"22 rupaye kitni baar aur kahan pay hue\"</i> ya <i>\"is mahine sabse zyada kis pe kharch hua\"</i>");
      } else {
        mode = 'steps';
        startFlow();
      }
    });
  }

  function startFlow() {
    draft = {};
    addBotChips("Kis category me expense hai?", CATEGORIES, (val) => {
      draft.category = val;
      askAmount();
    });
  }

  function askAmount() {
    addBotMessage(`<b>${draft.category}</b> — kitna amount? (type ya bolo)`);
  }

  function askMethod() {
    addBotChips("Payment kaise hua?", METHODS, (val) => {
      draft.method = val;
      if (val === "UPI") {
        addBotChips("Konse UPI app se?", UPI_APPS, (app) => {
          draft.upiApp = app;
          askAccount();
        });
      } else {
        draft.upiApp = "";
        askAccount();
      }
    });
  }

  function askAccount() {
    addBotChips("Konse account se?", ACCOUNTS, (val) => {
      draft.account = val;
      submitExpense();
    });
  }

  function submitExpense() {
    showTyping();
    callApi('addExpense', {
      amount: draft.amount, category: draft.category, paymentMethod: draft.method,
      upiApp: draft.upiApp, account: draft.account, note: draft.note || ""
    },
      function(data) {
        removeTyping();
        addBotMessage("✅ " + data.message, "success");
        refreshStats();
        setTimeout(showModePicker, 500);
      },
      function(err) {
        removeTyping();
        addBotMessage("❌ Error: " + err.message, "error");
        setTimeout(showModePicker, 800);
      });
  }

  function submitViaAI(text) {
    showTyping();
    callApi('parseExpenseWithAI', { text: text },
      function(parsed) {
        removeTyping();
        const summary = `${parsed.category} · ₹${parsed.amount} · ${parsed.paymentMethod}` +
          (parsed.upiApp ? ' · ' + parsed.upiApp : '') +
          (parsed.account ? ' · ' + parsed.account : '');
        addBotMessage("✅ Added!<br>" + summary, "success");
        refreshStats();
        setTimeout(showModePicker, 700);
      },
      function(err) {
        removeTyping();
        addBotMessage("❌ " + err.message, "error");
        setTimeout(showModePicker, 800);
      });
  }

  function askQuestion(question) {
    showTyping();
    callApi('askAI', { question: question },
      function(data) {
        removeTyping();
        addBotMessage(data.answer);
        setTimeout(showModePicker, 900);
      },
      function(err) {
        removeTyping();
        addBotMessage("❌ " + err.message, "error");
        setTimeout(showModePicker, 800);
      });
  }

  function enableMonthlySummary() {
    const btn = document.getElementById('enableSummaryBtn');
    btn.disabled = true;
    btn.innerText = "Setting up...";
    callApi('setupMonthlyTrigger', {},
      function(data) {
        btn.innerText = "✅ Enabled";
      },
      function(err) {
        btn.disabled = false;
        btn.innerText = "🔔 Enable Monthly Email Summary";
      });
  }

  function handleTextSend() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;

    if (mode === 'ai' && !draft.category) {
      addUserMessage(text);
      input.value = '';
      submitViaAI(text);
      return;
    }

    if (mode === 'ask') {
      addUserMessage(text);
      input.value = '';
      askQuestion(text);
      return;
    }

    if (draft.category && !draft.amount) {
      const amt = parseFloat(text);
      if (!amt || amt <= 0) {
        addBotMessage("Sahi amount daalo, jaise 150");
        return;
      }
      addUserMessage("₹" + amt);
      draft.amount = amt;
      input.value = '';
      askMethod();
      return;
    }

    addUserMessage(text);
    input.value = '';
    draft.note = text;
    addBotMessage("Got it, note add ho gaya.");
  }

  function addUserMessage(text) {
    const row = document.createElement('div');
    row.className = 'row user';
    row.innerHTML = `<div class="avatar">🙂</div><div class="bubble">${text}</div>`;
    chat.appendChild(row);
    scrollDown();
  }

  function addBotMessage(html, kind) {
    const row = document.createElement('div');
    row.className = 'row bot';
    row.innerHTML = `<div class="avatar">🤖</div><div class="bubble${kind ? ' ' + kind : ''}">${html}</div>`;
    chat.appendChild(row);
    scrollDown();
  }

  function addBotChips(question, options, onPick) {
    const row = document.createElement('div');
    row.className = 'row bot';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (question) bubble.innerHTML = '<div>' + question + '</div>';
    const grid = document.createElement('div');
    grid.className = 'chipGrid';
    options.forEach(([opt, icon]) => {
      const btn = document.createElement('button');
      btn.className = 'chip';
      btn.innerHTML = (icon ? `<span>${icon}</span>` : '') + `<span>${opt}</span>`;
      btn.onclick = () => {
        addUserMessage((icon ? icon + ' ' : '') + opt);
        grid.querySelectorAll('button').forEach(b => b.disabled = true);
        btn.classList.add('picked');
        onPick(opt);
      };
      grid.appendChild(btn);
    });
    bubble.appendChild(grid);
    row.innerHTML = '<div class="avatar">🤖</div>';
    row.appendChild(bubble);
    chat.appendChild(row);
    scrollDown();
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'typingRow';
    row.innerHTML = '<div class="avatar">🤖</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    chat.appendChild(row);
    scrollDown();
  }

  function removeTyping() {
    const el = document.getElementById('typingRow');
    if (el) el.remove();
  }

  function scrollDown() {
    chat.scrollTop = chat.scrollHeight;
  }

  function animateCount(el, to) {
    const from = parseInt(el.dataset.val || "0", 10);
    const duration = 500;
    const start = performance.now();
    function step(now) {
      const progress = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      const current = Math.round(from + (to - from) * eased);
      el.innerText = "₹" + current.toLocaleString('en-IN');
      if (progress < 1) requestAnimationFrame(step);
      else el.dataset.val = to;
    }
    requestAnimationFrame(step);
  }

  function refreshStats() {
    callApi('getStats', {},
      function(stats) {
        animateCount(document.getElementById('todayTotal'), Math.round(stats.today));
        animateCount(document.getElementById('monthTotal'), Math.round(stats.month));
      },
      function(err) { /* silent fail on background refresh */ });
  }

  document.getElementById('msgInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') handleTextSend();
  });

  // ===== VOICE INPUT =====
  let recognition = null;
  let isListening = false;

  function setupRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return null;
    const r = new SpeechRecognition();
    r.lang = 'en-IN';
    r.interimResults = false;
    r.maxAlternatives = 1;
    return r;
  }

  function toggleVoice() {
    const micBtn = document.getElementById('micBtn');

    if (isListening && recognition) {
      recognition.stop();
      return;
    }

    recognition = setupRecognition();
    if (!recognition) {
      addBotMessage("⚠️ Voice input is browser me support nahi hai. Text type kar do.");
      return;
    }

    isListening = true;
    micBtn.classList.add('listening');
    micBtn.innerText = '⏺';

    recognition.onresult = function(event) {
      const transcript = event.results[0][0].transcript;
      document.getElementById('msgInput').value = transcript;
      handleTextSend();
    };

    recognition.onerror = function() {
      addBotMessage("⚠️ Sun nahi paya, dobara try karo.");
    };

    recognition.onend = function() {
      isListening = false;
      micBtn.classList.remove('listening');
      micBtn.innerText = '🎤';
    };

    recognition.start();
  }

  // ===== CHARTS =====
  const CATEGORY_COLORS = {
    Food: "#34d399", Travel: "#60a5fa", Bills: "#fbbf24",
    Shopping: "#f472b6", Home: "#a78bfa", Personal: "#f87171", Other: "#94a3b8"
  };
  let pieChart = null, trendChart = null;
  let chartsVisible = false;

  function toggleChartView() {
    chartsVisible = !chartsVisible;
    document.getElementById('chartView').classList.toggle('visible', chartsVisible);
    document.getElementById('chat').classList.toggle('hidden', chartsVisible);
    document.getElementById('inputArea').classList.toggle('hidden', chartsVisible);
    document.getElementById('chatToggleBtn').innerText = chartsVisible ? '💬' : '📊';
    if (chartsVisible) loadCharts();
  }

  function loadCharts() {
    callApi('getDashboardData', {}, renderDashboard, function(err) {
      addBotMessage("❌ Dashboard load error: " + err.message, "error");
    });
  }

  function renderDashboard(data) {
    document.getElementById('dashToday').innerText = "₹" + Math.round(data.todayTotal).toLocaleString('en-IN');
    document.getElementById('dashMonth').innerText = "₹" + Math.round(data.monthTotal).toLocaleString('en-IN');
    document.getElementById('dashTopCat').innerText = data.topCategory;
    document.getElementById('dashCount').innerText = data.transactionCount;

    renderPieChart(data.summary);
    renderTrendChart(data.trend);
    renderRecentList(data.recent);
  }

  function renderRecentList(recent) {
    const el = document.getElementById('recentList');
    if (!recent.length) {
      el.innerHTML = '<div class="emptyState">Abhi tak koi expense nahi hai</div>';
      return;
    }
    el.innerHTML = recent.map(r => `
      <div class="recentItem">
        <div class="left">
          <span class="cat">${r.category}</span>
          <span class="meta">${r.date}${r.note ? ' · ' + r.note : ''}</span>
        </div>
        <div class="amt">₹${r.amount}</div>
      </div>
    `).join('');
  }

  function renderPieChart(summary) {
    const labels = Object.keys(summary);
    const values = Object.values(summary);
    const colors = labels.map(l => CATEGORY_COLORS[l] || "#94a3b8");
    const wrap = document.getElementById('pieCanvas').closest('.chartCard');

    if (!labels.length) {
      wrap.querySelector('.canvasWrap').innerHTML = '<div class="emptyState">Abhi tak koi expense nahi hai</div>';
      return;
    }

    const ctx = document.getElementById('pieCanvas').getContext('2d');
    if (pieChart) pieChart.destroy();
    pieChart = new Chart(ctx, {
      type: 'doughnut',
      data: { labels, datasets: [{ data: values, backgroundColor: colors, borderColor: '#0a0b0d', borderWidth: 2 }] },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { color: '#e5e7eb', padding: 12, font: { size: 11 }, boxWidth: 12 } },
          tooltip: { backgroundColor: '#16181d', borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1 }
        }
      }
    });
  }

  function renderTrendChart(trend) {
    const labels = trend.map(t => t.month);
    const values = trend.map(t => t.total);
    const wrap = document.getElementById('trendCanvas').closest('.chartCard');

    if (!labels.length) {
      wrap.querySelector('.canvasWrap').innerHTML = '<div class="emptyState">Abhi tak koi expense nahi hai</div>';
      return;
    }

    const ctx = document.getElementById('trendCanvas').getContext('2d');
    if (trendChart) trendChart.destroy();
    trendChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          data: values,
          backgroundColor: 'rgba(52,211,153,0.6)',
          borderColor: '#34d399',
          borderWidth: 1.5,
          borderRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { backgroundColor: '#16181d', borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1 }
        },
        scales: {
          x: { ticks: { color: '#9ca3af', font: { size: 11 } }, grid: { display: false } },
          y: { ticks: { color: '#9ca3af', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.05)' } }
        }
      }
    });
  }
</script>

</body>
</html>
